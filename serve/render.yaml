services:
  - type: web
    name: serve-api-1
    runtime: node
    rootDir: apps/api
    buildCommand: |
      npm install
      npx prisma generate
      npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 10000
      - key: SERVER_NAME
        value: server-1
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: serve-db
          property: connectionString
      - key: REDIS_URL
        sync: false
      - key: EMAIL_PROVIDER
        value: gmass
      - key: GMASS_API_KEY
        sync: false
      - key: GMASS_API_URL
        value: https://api.gmass.co/v1/send
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_SENDER_EMAIL
        sync: false
      - key: BREVO_SENDER_NAME
        sync: false
      - key: SMS_PROVIDER
        value: brevo
      - key: SMS_SENDER_ID
        value: Serve
      - key: AI_API_KEY
        sync: false
      - key: AI_MODEL
        value: gemini-2.0-flash

